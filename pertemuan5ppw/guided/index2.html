    $(document).ready(function() {
      var nilai = 75;
      var hasil = "";

      if (nilai >= 80) {
        hasil = "Nilai Anda A (Sangat Baik)";
      } else if (nilai >= 70) {
        hasil = "Nilai Anda B (Baik)";
      } else if (nilai >= 60) {
        hasil = "Nilai Anda C (Cukup)";
      } else {
        hasil = "Nilai Anda D (Kurang)";
      }

      $("#hasil").text(hasil);
    });
